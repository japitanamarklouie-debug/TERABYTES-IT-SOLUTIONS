<!DOCTYPE html>
<html lang="en">
<head>

    <title>Payment Reminder - Terabytes IT Solutions</title>
    <style>
        body {

            background-color: #e6e6e6;

    <!-- Siguroha nga sakto ang ngalan sa imong picture diri -->
